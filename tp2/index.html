<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TP1 - Prototipos | Entrenamiento y Rendimiento</title>
<style>
  * {
    box-sizing: border-box;
  }

  html {
    min-height: 100%;
    background: #eee4f7;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    max-width: 1100px;
    margin: 45px auto;
    padding: 0 24px;
    background: transparent;
    color: #29232e;
  }

  h1 {
    font-size: 2.8rem;
    line-height: 1.2;
    margin-bottom: 8px;
    font-weight: 800;
  }

  p.subtitle {
    color: #68616e;
    font-size: 1.25rem;
    margin-top: 0;
    margin-bottom: 50px;
  }

  .chart-block {
    background: #ffffff;
    border-radius: 22px;
    padding: 30px;
    margin: 35px 0;
    box-shadow: 0 8px 28px rgba(64, 36, 85, 0.10);
    overflow: hidden;
  }

  .chart-block h2 {
    font-size: 1.8rem;
    line-height: 1.3;
    margin-top: 0;
    margin-bottom: 24px;
    font-weight: 800;
  }

  .chart-block iframe {
    max-width: 100%;
  }

  footer {
    margin-top: 50px;
    padding: 24px 0;
    text-align: center;
    font-size: 0.9rem;
    color: #777;
    border-top: 1px solid #ded5e7;
  }

  @media (max-width: 768px) {
    body {
      margin: 25px auto;
      padding: 0 15px;
    }

    h1 {
      font-size: 2rem;
    }

    .chart-block {
      padding: 18px;
    }

    .chart-block h2 {
      font-size: 1.4rem;
    }
  }
</style>
</head>
<body>

  <h1>Entrenamiento y rendimiento · Prototipos</h1>
  <p class="subtitle">Entrega final infovis 2Q2026 — Valentina Barboza</p>

  <div class="chart-block">
    <h2>
    ¿Cómo varió el tiempo dedicado a
    <span style="color: #AD5BD3;">fuerza</span> y
    <span style="color: #E5AD16;">carrera</span>
    a lo largo de los meses?
    </h2>
    <div class="flourish-embed flourish-chart" data-src="visualisation/30107520"><script src="https://public.flourish.studio/resources/embed.js"></script><noscript><img src="https://public.flourish.studio/visualisation/30107520/thumbnail" width="100%" alt="Minutos dedicados a Fuerza y Carrera por mes" /></noscript></div>
  </div>

  <div class="chart-block">
    <div class="flourish-embed flourish-scatter" data-src="visualisation/30107873"><script src="https://public.flourish.studio/resources/embed.js"></script><noscript><img src="https://public.flourish.studio/visualisation/30107873/thumbnail" width="100%" alt="scatter visualization" /></noscript></div>
  </div>
  
  <footer>
    Fuente: datos personales de Garmin Connect / TrainingPeaks, feb–ago 2026.
  </footer>

</body>
</html>
